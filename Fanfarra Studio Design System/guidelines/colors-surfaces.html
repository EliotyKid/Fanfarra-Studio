<!-- @dsCard group="Colors" viewport="700x210" name="Surface layering" subtitle="Elevation is expressed by stepping lighter, not by shadow alone" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Surface layering</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div style="background:var(--bg-app);border:1px dashed var(--border-default);border-radius:16px;padding:14px;display:grid;gap:8px"><span class="t">--bg-app · #101018</span><div style="background:var(--surface-panel);border:1px solid var(--border-subtle);border-radius:16px;padding:14px;display:grid;gap:8px;box-shadow:var(--shadow-panel)"><span class="t">--surface-panel · #16161F</span><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div style="background:var(--bg-sunken);border:1px solid var(--border-default);border-radius:12px;padding:12px"><span class="t">--bg-sunken · controls</span></div><div style="background:var(--surface-card);border-radius:6px;padding:12px"><span class="t">--surface-card · #1A1A24</span></div><div style="background:var(--surface-raised);border-radius:12px;padding:12px"><span class="t">--surface-raised · hover</span></div></div></div></div></body></html>
