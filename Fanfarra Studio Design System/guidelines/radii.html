<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Corner radii</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div class="row" style="grid-template-columns:repeat(7,1fr)"><div class="sw" style="justify-items:center;text-align:center"><div style="width:64px;height:64px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-xs)"></div><div class="n">xs · 4</div><div class="t">step block</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:64px;height:64px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div class="n">sm · 6</div><div class="t">track header</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:64px;height:64px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-md)"></div><div class="n">md · 10</div><div class="t">nav · swatch</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:64px;height:64px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-lg)"></div><div class="n">lg · 12</div><div class="t">button · select</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:64px;height:64px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-xl)"></div><div class="n">xl · 16</div><div class="t">panel</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:64px;height:64px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-2xl)"></div><div class="n">2xl · 24</div><div class="t">app frame</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:64px;height:64px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-full)"></div><div class="n">full · ∞</div><div class="t">play · dots</div></div></div></body></html>
