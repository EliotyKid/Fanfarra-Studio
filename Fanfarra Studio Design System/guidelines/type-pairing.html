<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Title pairing</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px"><div><h1 style="font:var(--type-title)">Marcha de Entrada</h1><div style="font:var(--type-meta);color:var(--fg-2);margin-top:6px">Fanfarra Municipal</div></div><div style="font:var(--type-value);color:var(--fg-1);padding:12px 14px;border:1px solid var(--border-default);border-radius:12px;background:var(--bg-sunken)">120 BPM</div></div></body></html>
