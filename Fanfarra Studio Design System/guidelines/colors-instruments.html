<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Instrument colors</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div class="row" style="grid-template-columns:repeat(5,1fr);gap:16px"><div class="sw"><div class="chip" style="height:64px;background:var(--inst-bumbo)"></div><div class="n">Bumbo</div><div class="h">#F59E0B</div><div class="t">--inst-bumbo</div></div><div class="sw"><div class="chip" style="height:64px;background:var(--inst-prato)"></div><div class="n">Prato</div><div class="h">#38BDF8</div><div class="t">--inst-prato</div></div><div class="sw"><div class="chip" style="height:64px;background:var(--inst-tarol)"></div><div class="n">Tarol</div><div class="h">#22C55E</div><div class="t">--inst-tarol</div></div><div class="sw"><div class="chip" style="height:64px;background:var(--inst-surdo)"></div><div class="n">Surdo</div><div class="h">#A855F7</div><div class="t">--inst-surdo</div></div><div class="sw"><div class="chip" style="height:64px;background:var(--inst-repique)"></div><div class="n">Repique</div><div class="h">#EC4899</div><div class="t">--inst-repique</div></div></div></body></html>
