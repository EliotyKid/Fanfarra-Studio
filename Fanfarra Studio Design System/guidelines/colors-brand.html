<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Brand violet</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div class="row" style="grid-template-columns:1.4fr 1.4fr repeat(5,1fr)"><div class="sw"><div class="chip" style="height:72px;background:var(--violet-500)"></div><div class="n">Primary</div><div class="h">#8B5CF6</div><div class="t">--violet-500</div></div><div class="sw"><div class="chip" style="height:72px;background:var(--violet-400)"></div><div class="n">Primary Light</div><div class="h">#A78BFA</div><div class="t">--violet-400</div></div><div class="sw"><div class="chip" style="height:72px;background:var(--violet-300)"></div><div class="n">300</div><div class="h">#C4B5FD</div></div><div class="sw"><div class="chip" style="height:72px;background:var(--violet-600)"></div><div class="n">600</div><div class="h">#7C3AED</div></div><div class="sw"><div class="chip" style="height:72px;background:var(--violet-700)"></div><div class="n">700</div><div class="h">#6D28D9</div></div><div class="sw"><div class="chip" style="height:72px;background:var(--violet-950)"></div><div class="n">950</div><div class="h">#2A1B5C</div></div><div class="sw"><div class="chip" style="height:72px;background:var(--accent-soft)"></div><div class="n">Soft</div><div class="h">violet 20%</div><div class="t">--accent-soft</div></div></div></body></html>
