<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & glow" subtitle="Dark drop shadows for panels; violet glow only on the accent" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Elevation & glow</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div class="row" style="grid-template-columns:repeat(4,1fr);gap:24px;padding-top:8px"><div class="sw" style="justify-items:center;text-align:center"><div style="width:100%;height:72px;border-radius:14px;background:var(--surface-panel);box-shadow:var(--shadow-panel)"></div><div class="n" style="margin-top:6px">Panel</div><div class="t">--shadow-panel</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:100%;height:72px;border-radius:14px;background:var(--surface-card);box-shadow:var(--shadow-pop)"></div><div class="n" style="margin-top:6px">Popover</div><div class="t">--shadow-pop</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:100%;height:72px;border-radius:14px;background:var(--accent);box-shadow:var(--shadow-accent)"></div><div class="n" style="margin-top:6px">Accent glow</div><div class="t">--shadow-accent</div></div><div class="sw" style="justify-items:center;text-align:center"><div style="width:100%;height:72px;border-radius:14px;background:var(--surface-card);box-shadow:var(--focus-ring)"></div><div class="n" style="margin-top:6px">Focus ring</div><div class="t">--focus-ring</div></div></div></body></html>
