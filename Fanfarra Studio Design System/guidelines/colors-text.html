<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Text colors</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div class="row" style="gap:10px"><div style="display:grid;grid-template-columns:150px 140px 1fr;align-items:baseline;gap:12px"><span class="t" style="color:var(--fg-2)">--fg-1</span><span class="h">Texto principal</span><span style="font:500 18px/1.2 var(--font-body);color:var(--fg-1)">Marcha de Entrada</span></div><div style="display:grid;grid-template-columns:150px 140px 1fr;align-items:baseline;gap:12px"><span class="t" style="color:var(--fg-2)">--fg-2</span><span class="h">Texto secundário</span><span style="font:500 18px/1.2 var(--font-body);color:var(--fg-2)">5 instrumentos · 4 compassos</span></div><div style="display:grid;grid-template-columns:150px 140px 1fr;align-items:baseline;gap:12px"><span class="t" style="color:var(--fg-2)">--fg-3</span><span class="h">Texto terciário</span><span style="font:500 18px/1.2 var(--font-body);color:var(--fg-3)">Aprenda. Toque. Evolua.</span></div><div style="display:grid;grid-template-columns:150px 140px 1fr;align-items:baseline;gap:12px"><span class="t" style="color:var(--fg-2)">--fg-disabled</span><span class="h">Desabilitado</span><span style="font:500 18px/1.2 var(--font-body);color:var(--fg-disabled)">Indisponível</span></div><div style="display:grid;grid-template-columns:150px 140px 1fr;align-items:baseline;gap:12px"><span class="t" style="color:var(--fg-2)">--fg-accent</span><span class="h">Destaque</span><span style="font:500 18px/1.2 var(--font-body);color:var(--fg-accent)">Studio</span></div></div></body></html>
