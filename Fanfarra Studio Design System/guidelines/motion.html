<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Short, ease-out, no bounce — hover over the pills" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}.mo:hover{background:var(--accent-soft)!important;border-color:var(--accent)!important}.mo:active{transform:scale(.97)}</style></head><body><div class="row" style="grid-template-columns:repeat(4,1fr);gap:16px"><div class="sw"><div class="mo" style="height:44px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-default);transition:all var(--dur-instant) var(--ease-out);cursor:pointer;display:grid;place-items:center;font:500 14px var(--font-mono)">80ms</div><div class="n">--dur-instant</div><div class="t">press scale</div></div><div class="sw"><div class="mo" style="height:44px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-default);transition:all var(--dur-fast) var(--ease-out);cursor:pointer;display:grid;place-items:center;font:500 14px var(--font-mono)">120ms</div><div class="n">--dur-fast</div><div class="t">hover color</div></div><div class="sw"><div class="mo" style="height:44px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-default);transition:all var(--dur-base) var(--ease-out);cursor:pointer;display:grid;place-items:center;font:500 14px var(--font-mono)">180ms</div><div class="n">--dur-base</div><div class="t">popover · glow</div></div><div class="sw"><div class="mo" style="height:44px;border-radius:12px;background:var(--surface-card);border:1px solid var(--border-default);transition:all var(--dur-slow) var(--ease-out);cursor:pointer;display:grid;place-items:center;font:500 14px var(--font-mono)">280ms</div><div class="n">--dur-slow</div><div class="t">drawer</div></div></div><div class="t" style="margin-top:12px">--ease-out cubic-bezier(.2,.8,.2,1) · press = scale(.97) · reduced-motion respected</div></body></html>
