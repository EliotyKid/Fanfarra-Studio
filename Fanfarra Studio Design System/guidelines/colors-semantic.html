<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success / warning / danger + 14% soft fills (borrowed from Tarol, Bumbo, Repique)" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Semantic status</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div class="row" style="grid-template-columns:repeat(3,1fr);gap:20px"><div class="sw"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="chip" style="height:56px;background:var(--success)"></div><div class="chip" style="height:56px;background:var(--success-soft);border-color:var(--success)"></div></div><div class="n">Sucesso</div><div class="h">#22C55E · soft 14%</div><div class="t">--success / --success-soft</div></div><div class="sw"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="chip" style="height:56px;background:var(--warning)"></div><div class="chip" style="height:56px;background:var(--warning-soft);border-color:var(--warning)"></div></div><div class="n">Aviso</div><div class="h">#F59E0B · soft 14%</div><div class="t">--warning / --warning-soft</div></div><div class="sw"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="chip" style="height:56px;background:var(--danger)"></div><div class="chip" style="height:56px;background:var(--danger-soft);border-color:var(--danger)"></div></div><div class="n">Erro</div><div class="h">#EC4899 · soft 14%</div><div class="t">--danger / --danger-soft</div></div></div></body></html>
