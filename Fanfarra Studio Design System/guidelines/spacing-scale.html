<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base with 2/6/10 half-steps for tight controls" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.n{font:600 13px/1.2 var(--font-body);color:var(--fg-1)}.h{font:400 12px/1.3 var(--font-mono);color:var(--fg-2)}.t{font:400 11px/1.3 var(--font-mono);color:var(--fg-3)}.chip{border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.06)}.sw{display:grid;gap:6px;align-content:start}.row{display:grid;gap:12px}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px;height:120px"><div style="display:grid;gap:6px;justify-items:center"><div style="width:2px;height:2px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">2</div><div class="t">0-5</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:4px;height:4px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">4</div><div class="t">1</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:6px;height:6px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">6</div><div class="t">1-5</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:8px;height:8px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">8</div><div class="t">2</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:10px;height:10px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">10</div><div class="t">2-5</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:12px;height:12px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">12</div><div class="t">3</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:16px;height:16px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">16</div><div class="t">4</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:20px;height:20px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">20</div><div class="t">5</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:24px;height:24px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">24</div><div class="t">6</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:32px;height:32px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">32</div><div class="t">8</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:40px;height:40px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">40</div><div class="t">10</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:48px;height:48px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">48</div><div class="t">12</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--accent);border-radius:2px"></div><div class="h" style="color:var(--fg-1)">64</div><div class="t">16</div></div></div></body></html>
