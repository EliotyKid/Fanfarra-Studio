<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Fanfarra Studio</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}body{display:grid;grid-template-columns:960px 320px}.main{background:var(--violet-500);display:grid;place-items:center}.name{font:800 92px/1 var(--font-display);color:#fff;letter-spacing:-.02em;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style></head>
<body><div class="main"><div class="name">Fanfarra Studio</div></div><div class="strip"><div style="background:var(--inst-prato)"></div><div style="background:var(--inst-bumbo)"></div><div style="background:var(--inst-tarol)"></div><div style="background:var(--inst-repique)"></div></div></body></html>
