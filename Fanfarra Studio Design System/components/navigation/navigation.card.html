<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Navigation</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px}.lbl{font:400 11px/1 var(--font-mono);color:var(--fg-3);margin-bottom:8px}.r{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.st{display:grid;gap:18px}</style></head>
<body><div id="root"></div><script type="text/babel">
const NS = window.FanfarraStudioDesignSystem_fca01a;

const { NavItem } = NS;
function Demo(){
  const [a,setA]=React.useState('toques'); const items=[['toques','music','Toques'],['sobre','info','Sobre'],['contato','mail','Contato']];
  return <div style={{display:'grid',gridTemplateColumns:'180px 1fr',gap:40,margin:'-20px 0 0 -24px'}}>
    <nav style={{background:'var(--bg-app)',borderRight:'1px solid var(--border-subtle)',padding:'20px 0',display:'grid',gap:8,alignContent:'start',minHeight:230}}>{items.map(([k,i,l])=><NavItem key={k} icon={i} label={l} active={a===k} onClick={()=>setA(k)}/>)}</nav>
    <nav style={{display:'grid',gap:6,alignContent:'start',paddingTop:20,maxWidth:260}}><div className="lbl">inset (drawer)</div>{items.map(([k,i,l])=><NavItem key={k} inset icon={i} label={l} active={a===k} onClick={()=>setA(k)}/>)}</nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
