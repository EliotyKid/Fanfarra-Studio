<!-- @dsCard group="Components" viewport="700x300" name="Selects & sliders" subtitle="Select (BPM, compasso) · VolumeSlider · Slider" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Selects & sliders</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px}.lbl{font:400 11px/1 var(--font-mono);color:var(--fg-3);margin-bottom:8px}.r{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.st{display:grid;gap:18px}</style></head>
<body><div id="root"></div><script type="text/babel">
const NS = window.FanfarraStudioDesignSystem_fca01a;

const { Select, VolumeSlider, Slider } = NS;
function Demo(){
  const [bpm,setBpm]=React.useState(120); const [sig,setSig]=React.useState('4/4'); const [v,setV]=React.useState(70); const [m,setM]=React.useState(false); const [s,setS]=React.useState(30);
  return <div className="st">
    <div><div className="lbl">Select — click to open · ↑/↓ · Enter · Esc</div><div className="r">
      <Select label="Andamento" icon="music-2" value={bpm} onChange={setBpm} options={[80,90,100,110,120,130,140].map(x=>({value:x,label:x+' BPM'}))}/>
      <Select label="Compasso" icon="drum" value={sig} onChange={setSig} options={['2/4','3/4','4/4']}/>
      <Select label="Andamento" value={bpm} onChange={setBpm} size="lg" options={[80,90,100,110,120,130,140].map(x=>({value:x,label:x+' BPM'}))}/>
      <Select label="Compasso" icon="drum" value="4/4" options={['4/4']} disabled/></div></div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:32}}>
      <div><div className="lbl">VolumeSlider — glyph toggles mute ({m?'mudo':v+'%'})</div><VolumeSlider value={v} onChange={setV} muted={m} onMuteToggle={setM} width={260}/></div>
      <div><div className="lbl">Slider — generic ({s})</div><div style={{display:'flex'}}><Slider label="Swing" value={s} onChange={setS} max={60}/></div></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
